<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Restaurant Locator - by Algolia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./assets/favicon.ico" type="image/png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@8.19.1/themes/reset-min.css" integrity="sha256-ZFIW2nI3ZIuMFVoMQBZOjzhdjxfheCmTm/Ajq31ZhNM=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@8.19.1/themes/satellite-min.css" integrity="sha256-LpV56au6/lX7sNR7R1j7Jy0Y6jREe2uHOQQZxg9uipo=" crossorigin="anonymous">
    -->
    <style>
      #geo-search .ais-GeoSearch-map {
        height: 200px;
      }
    </style>
  </head>

  <body>
    <!-- INTERFACE -->
    <div id="searchbox" class="mx-4 my-4"></div>
    <div class="flex gap-4 mx-4 mb-4">
      <div class="w-1/4 border-1 border-gray-200 rounded-md">
        <!-- Food Cuisine Refinement --> 
        <div class="m-4 p-4 border-1 border-gray-200 rounded-md">
          <h4 class="mb-2 text-sm font-semibold uppercase ">Food/Cuisine Type</h4>
          <div id="food-type-refinement-list"></div>
        </div>

        <!-- Price Range Refinement -->
        <div class="m-4 p-4 border-1 border-gray-200 rounded-md">
          <h4 class="mb-2 text-sm font-semibold uppercase ">Price Range</h4>
          <div id="price-range-refinement-list"></div>
        </div>

        <!-- Payment Method Refinement -->
        <div class="m-4 p-4 border-1 border-gray-200 rounded-md">
          <h4 class="mb-2 text-sm font-semibold uppercase ">Payment Method</h4>
          <div id="payment-method-refinement-list"></div>
        </div>

        <div class="m-4 p-4 border-1 border-gray-200 rounded-md">
          <h4 class="mb-2 text-sm font-semibold uppercase ">Ratings</h4>
          <div id="ratings-menu"></div>
        </div>
        
      </div>
      <main class="flex-1">
        <div id="geo-search" class="border-1 border-gray-200 rounded-md"></div>
        <div class="flex gap-4 justify-between items-center py-4">
          <div id="stats"></div>
          <div id="sort-by"></div>
        </div>
        <div id="hits" class="mb-4"></div>
        <div id="pagination"></div>
      </main>
    </div>
    <!-- /INTERFACE -->

    <!-- TEMPLATES -->
    <script type="text/html" id="result-template">
      <div class="results__item">
      	<div class="result">
      		<div class="result__image-container">
      		</div>
      		<div class="result__text-container">
      			<h1 class="result__title">{{name}}</h1>
      			<p class="result__summary">{{food_type}} | {{neighborhood}} | {{price_range}}</p>
      		</div>
      	</div>
      </div>
    </script>

    <script type="text/html" id="no-results-template">
      <div id="no-results-message">
      	<p>We didn't find any results for the search <em>"{{query}}"</em>.</p>
      	<a href="." class='clear-all'>Clear search</a>
      </div>
    </script>
    <!-- /TEMPLATES -->

    <!-- SCRIPTS -->
    <script src="./index.js"></script>

    <!-- Load the Algolia Experiences library at the end of <body> -->
    <script src="https://cdn.jsdelivr.net/npm/@algolia/experiences/dist/experiences.js?appId=9VYW6DIHRW&apiKey=97f0583a82af28f88461e62ad0bdf8e9&experienceId=9VYW6DIHRW&env=prod"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/algoliasearch@5.57.0/dist/lite/builds/browser.umd.js"
      integrity="sha256-NJrnXIMFVRGMM2IieD83YpTvsPPIFKKyj4K/MNyTRQU="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.112.0/dist/instantsearch.production.min.js" integrity="sha256-L/uuFNSZ4b4RfpkGECfRzFJaO752CMZxKmoJQScpEPA=" crossorigin="anonymous"></script>
    <script>
      const { liteClient: algoliasearch } = window["algoliasearch/lite"];

      const appID = "9VYW6DIHRW";
      const apiKey = "97f0583a82af28f88461e62ad0bdf8e9";
      const indexName = "restaurants_list";

      const searchClient = algoliasearch(appID, apiKey);

      function renderStars(count, html) {
        return Array.from(
          { length: 5 },
          (_, i) =>
            html`<span class="${i < count ? "text-amber-400" : "text-gray-300"}">★</span>`
        );
      }

      const search = instantsearch({
        indexName,
        searchClient,
      });

      search.addWidgets([
        instantsearch.widgets.autocomplete({
          container: "#searchbox",
          placeholder: "Find your restaurant...",
          indices: [
            {
              indexName,
              getQuery: (item) => item.name,
              getURL: (item) => `/search?q=${item.name}`,
              templates: {
                header: (_, { html }) => html`<div>Restaurants</div>`,
                item: ({ item, onSelect }, { html }) =>
                  html`<div onClick=${onSelect}>${item.name}</div>`,
              },
            }
          ]
        }),

        // Geo tracking: rank/filter by distance from the searcher.
        // Falls back to IP-based location until precise coords are available (see below).
        instantsearch.widgets.configure({
          aroundLatLngViaIP: true,
        }),

        // stats
        instantsearch.widgets.stats({
          container: "#stats",
            templates: {
              text(data, { html }) {
                let count = "";

                if (data.hasManyResults) {
                  count += `${data.nbHits} results`;
                } else if (data.hasOneResult) {
                  count += `1 result`;
                } else {
                  count += `no result`;
                }

                return html`<span class="font-semibold">${count}</span><span class="text-sm"> found in ${data.processingTimeMS}ms</span>`;
              },
            }
        }),

        // sort by
        instantsearch.widgets.sortBy({
          container: "#sort-by",
          items: [
            { label: "Relavance", value: "restaurants_list" },
            { label: "Rating (Best to Worst)", value: "restaurants_list_rating_desc" },
            { label: "Rating (Worst to Best)", value: "restaurants_list_rating_asc" }
          ],
          cssClasses: {
            select: "px-3 py-2 border-1 border-gray-200 rounded-md"
          }
        }),

        // Search results
        instantsearch.widgets.hits({
          container: "#hits",
          cssClasses: {
            list: "grid grid-cols-1 gap-4",
            item: "flex gap-4 border-1 border-gray-200 rounded-md"
          },
          templates: {
            item(hit, { html, components }) {
              return html`
                <img class="h-[120px]" src="${hit.image_url}" />
                <div class="flex-1 py-4">
                  <h2 class="text-lg font-medium">${components.Highlight({ attribute: "name", hit })}</h2>
                  <div class="flex items-center gap-1 mt-1 text-gray-400">${hit.stars_avg} ${renderStars(hit.stars_count, html)} (${hit.reviews_count})</div>
                  <p class="text-gray-400">${hit.food_type} | ${hit.neighborhood} | ${hit.price_range}</p>
                </div>
                <div class="flex flex-col gap-2 my-4 pr-4">
                  <a href="${hit.mobile_reserve_url}" class="px-3 py-2 bg-gray-100 border-1 border-gray-200 rounded-md text-center" target="_blank">Reserve</a>
                  <a href="tel:${hit.phone}" class="px-3 py-2 bg-gray-100 border-1 border-gray-200 rounded-md text-center">Call</a>
                </div>
              `;
            },
          },
        }),

        // Pagination
        instantsearch.widgets.pagination({
          container: "#pagination",
          cssClasses: {
            root: "flex justify-end",
            list: "flex w-fit border-1 border-gray-200 rounded-md",
            item: "px-2 py-1 border-r-1 border-gray-200 last:border-0",
            selectedItem: "bg-gray-200"
          }
        }),

        // Payment Method Refinement List
        instantsearch.widgets.refinementList({
          container: "#food-type-refinement-list",
          attribute: "food_type",
          sortBy: ["count:desc"],
          cssClasses: {
            item: "px-2 py-1 rounded-md",
            selectedItem: "bg-gray-100",
            label: "flex gap-2 items-center",
            labelText: "flex-1",
            count: "px-1 py-1/2 border-1 border-gray-200 bg-gray-100 rounded-md text-sm"
          }
        }),

        instantsearch.widgets.refinementList({
          container: "#payment-method-refinement-list",
          attribute: "payment_options",
          sortBy: ["count:desc"],
          cssClasses: {
            item: "px-2 py-1 rounded-md",
            selectedItem: "bg-gray-100",
            label: "flex gap-2 items-center",
            labelText: "flex-1",
            count: "px-1 py-1/2 border-1 border-gray-200 bg-gray-100 rounded-md text-sm"
          }
        }),

        instantsearch.widgets.refinementList({
          container: "#price-range-refinement-list",
          attribute: "price_range",
          sortBy: ["count:desc"],
          cssClasses: {
            item: "px-2 py-1 rounded-md",
            selectedItem: "bg-gray-100",
            label: "flex gap-2 items-center",
            labelText: "flex-1",
            count: "px-1 py-1/2 border-1 border-gray-200 bg-gray-100 rounded-md text-sm"
          }
        }),

        // Ratings Menu
        instantsearch.widgets.ratingMenu({
          container: "#ratings-menu",
          attribute: "stars_count",
          templates: {
            item(item, { html }) {
              const filledCount = item.stars.filter(Boolean).length;
              return html`
                <a href="${item.url}" class="flex items-center gap-2">
                  <span class="flex items-center gap-1">${renderStars(filledCount, html)}</span>
                  <span class="flex-1 text-sm text-gray-400">& Up</span>
                </a>
              `;
            },
          },
          cssClasses: {
            item: "flex gap-2 px-2 py-1 rounded-md",
            selectedItem: "bg-gray-100"
          }
        })
      ]);

      search.start();

      // Upgrade from IP-based location to the browser's precise geolocation, if granted.
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            search.helper
              .setQueryParameter("aroundLatLngViaIP", undefined)
              .setQueryParameter("aroundLatLng", `${latitude},${longitude}`)
              .search();
          },
          (error) => {
            console.warn("Geolocation unavailable, using IP-based location instead.", error);
          }
        );
      }

      // Called by the Google Maps script once `google.maps` (Map, LatLng, etc.) is fully loaded.
      // The geoSearch widget is added here rather than in the main addWidgets() call above because
      // googleReference must point to a ready google.maps object, not just the early bootstrap stub.
      window.initGeoSearch = function () {
        search.addWidgets([
          instantsearch.widgets.geoSearch({
            container: "#geo-search",
            googleReference: window.google,
            cssClasses: {
              control: 'hidden'
            }
          }),
        ]);
      };
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBy_506jx3yyEZuPjXE0-pR4vFgGAbzYd8&loading=async&callback=initGeoSearch"
      async
      defer
    ></script>
    <!-- /SCRIPTS -->
  </body>
</html>
